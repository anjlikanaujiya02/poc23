<!DOCTYPE html>
<html>
<head>
    <title>S3 Website</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }
        h1 {
            color: #2c3e50;
            margin-top: 50px;
        }
        p {
            color: #555;
        }
        .box {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 50%;
            box-shadow: 0px 0px 10px gray;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Welcome to My AWS S3 Website...</h1>
    <p>This site is hosted using Amazon S3</p>
    <button onclick="showMessage()">Click Me</button>
</div>

<script>
    function showMessage() {
        alert("✅ Your S3 website is working!");
    }
</script>

</body>
</html>
